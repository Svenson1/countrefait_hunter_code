<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Counterfeit Hunter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-width app column. On wide screens it sits in a device frame on a drafting-grid desk, with a prototype-notes rail mapping each screen to its requirement IDs. */
:root{
  --desk:#DFE5EC; --grid:rgba(31,78,121,.07);
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E9EEF3;
  --line:#D3DBE4; --line-strong:#8A99A8;
  --fg:#12202D; --fg-2:#56636F; --fg-2-strong:#2C3946;
  --band:#15334E; --band-fg:#FFFFFF; --band-fg-2:#A7BED5; --band-track:#2A4B6A;
  --link:#1D5A8E; --btn:#1D5A8E; --btn-fg:#FFFFFF; --btn-line:#9DB4CB; --accent-soft:#E0EAF4;
  --ok:#1B6A36; --ok-soft:#E2F1E6; --bad:#AE2717; --bad-soft:#FAE5E1; --warn:#8A5200; --warn-soft:#FCEFD8;
  --focus:#2E7FD4; --scrim:rgba(9,18,28,.48);
  --shadow:0 1px 2px rgba(18,32,45,.06),0 8px 24px rgba(18,32,45,.08);
  --f-display:'Barlow Semi Condensed','Arial Narrow','Helvetica Neue',sans-serif;
  --f-body:'Barlow','Segoe UI',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#0A1016; --grid:rgba(140,189,235,.05);
    --bg:#101922; --surface:#17222D; --surface-2:#1F2C38;
    --line:#2B3A49; --line-strong:#6C8094;
    --fg:#E5ECF2; --fg-2:#9BAAB8; --fg-2-strong:#CAD5DF;
    --band:#0C1D2D; --band-fg:#F2F6FA; --band-fg-2:#8EA8C2; --band-track:#23384D;
    --link:#8CBDEB; --btn:#2C6AA3; --btn-fg:#FFFFFF; --btn-line:#3F6183; --accent-soft:#1A3045;
    --ok:#74CF90; --ok-soft:#142F21; --bad:#FF8D7D; --bad-soft:#381C18; --warn:#F1B75A; --warn-soft:#352711;
    --focus:#7DB6F0; --scrim:rgba(0,0,0,.6);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#0A1016; --grid:rgba(140,189,235,.05);
  --bg:#101922; --surface:#17222D; --surface-2:#1F2C38;
  --line:#2B3A49; --line-strong:#6C8094;
  --fg:#E5ECF2; --fg-2:#9BAAB8; --fg-2-strong:#CAD5DF;
  --band:#0C1D2D; --band-fg:#F2F6FA; --band-fg-2:#8EA8C2; --band-track:#23384D;
  --link:#8CBDEB; --btn:#2C6AA3; --btn-fg:#FFFFFF; --btn-line:#3F6183; --accent-soft:#1A3045;
  --ok:#74CF90; --ok-soft:#142F21; --bad:#FF8D7D; --bad-soft:#381C18; --warn:#F1B75A; --warn-soft:#352711;
  --focus:#7DB6F0; --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
/* High contrast (UI-70): stronger lines and secondary text in either theme */
:root.hc{ --line:var(--line-strong); --fg-2:var(--fg-2-strong); }
:root{font-size:16px}
:root.lt{font-size:18.5px}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--fg);font-family:var(--f-body);font-size:1rem;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
body::after{content:"";position:fixed;inset:auto 0 0;height:env(safe-area-inset-bottom,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;font-weight:700}
p{margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;left:0;top:0}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.7rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-2)}
.hint{font-size:.85rem;color:var(--fg-2);line-height:1.4}
.lead{color:var(--fg-2);font-size:1rem}

/* Desk + device */
.desk{height:100%;display:flex;justify-content:center;align-items:stretch;gap:40px}
.device{position:relative;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.notes{display:none}
@media (min-width:600px){
  .desk{align-items:center;padding-block:20px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
  .device{width:400px;flex:none;height:min(880px,100%);border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow)}
}
@media (min-width:960px){
  .notes{display:flex;flex-direction:column;gap:14px;width:300px;flex:none;align-self:center;max-height:min(880px,100%);overflow-y:auto;color:var(--fg-2);font-size:.9rem}
  .notes h2{font-size:1.5rem;color:var(--fg)}
  .notes h3{font-size:1rem;color:var(--fg);margin-top:6px}
  .notes .ids{color:var(--link);font-size:.85rem}
  .notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
  .notes code{font-family:var(--f-mono);font-size:.85em;background:var(--surface-2);padding:1px 5px;border-radius:4px;color:var(--fg)}
  .notes hr{border:0;border-top:1px solid var(--line);width:100%;margin:4px 0}
}

/* Header band */
.bar{background:var(--band);color:var(--band-fg);flex:none}
.bar-in{display:flex;align-items:center;gap:6px;min-height:60px;padding-block:8px}
.bar-t{flex:1;min-width:0;padding-inline:4px}
.bar h1{font-size:1.3rem;letter-spacing:.005em}
.bar .sub{font-size:.8rem;color:var(--band-fg-2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar.home .bar-in{padding-block:14px 16px}
.bar .mark{color:var(--band-fg);display:grid;place-items:center;width:44px;height:44px;flex:none}
.icon-btn{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:transparent;border:0;color:inherit;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.1)}
.steps{list-style:none;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:2px 12px}
.steps .s{display:flex;flex-direction:column;gap:6px;font-size:.72rem;color:var(--band-fg-2);font-weight:500;min-width:0}
.steps .s span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .s i{height:3px;border-radius:2px;background:var(--band-track)}
.steps .s.done i{background:var(--band-fg-2)}
.steps .s.on{color:var(--band-fg);font-weight:600}
.steps .s.on i{background:var(--band-fg)}

/* Scroll + footer + tabs */
.scroll{flex:1;overflow-y:auto;min-height:0;overscroll-behavior:contain}
.pad{padding-block:18px 28px}
.stack{display:flex;flex-direction:column;gap:18px}
.section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.h3{font-family:var(--f-display);font-size:1.1rem;font-weight:700;color:var(--fg)}
.foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding-block:12px;display:flex;flex-direction:column;gap:8px}
.foot-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot .fine{text-align:center;font-size:.78rem;color:var(--fg-2)}
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--fg-2);background:transparent;border:0}
.tab[aria-current="page"]{color:var(--link)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;font-weight:600;font-size:1rem;line-height:1.2;border:1.5px solid transparent;width:100%;text-align:center;transition:background .15s,border-color .15s}
.btn.primary{background:var(--btn);color:var(--btn-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.secondary{background:var(--surface);color:var(--link);border-color:var(--btn-line)}
.btn.secondary:hover{background:var(--accent-soft)}
.btn.ghost{background:transparent;color:var(--link);min-height:44px}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.sm{min-height:42px;font-size:.92rem;padding:0 14px;width:auto}
.btn.big{min-height:56px;font-size:1.06rem}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.link{background:none;border:0;color:var(--link);font-weight:600;font-size:.9rem;padding:8px 2px;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.link.center{align-self:center}
.mini{min-height:36px;padding:0 12px;border-radius:9px;border:1.5px solid var(--btn-line);background:var(--surface);color:var(--link);font-weight:600;font-size:.82rem}
.mini.icon{width:36px;padding:0;display:grid;place-items:center}

/* Groups and rows */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:54px;border-top:1px solid var(--line);margin:0}
.group>.row:first-child,.group>*:first-child{border-top:0}
button.row{width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-bottom:0;color:var(--fg)}
button.row:hover{background:var(--surface-2)}
.row.kv{justify-content:space-between;align-items:flex-start}
.row.kv>span:first-child{color:var(--fg-2);font-size:.9rem;flex:none;padding-top:2px}
.row.kv>:last-child{text-align:right;min-width:0}
.rec-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rec-name{font-weight:600;line-height:1.25}
.rec-meta{font-size:.8rem;color:var(--fg-2)}
.rec-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.rec-th,.p-ic{width:52px;height:52px;border-radius:10px;object-fit:cover;flex:none;background:var(--surface-2)}
.p-ic{object-fit:contain;padding:3px}
.row svg.chev{color:var(--fg-2);flex:none}
.empty{color:var(--fg-2);font-size:.92rem;padding:4px 2px}
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:48px 12px;color:var(--fg-2)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg-2);white-space:nowrap;line-height:1.3;align-self:flex-start}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.info{background:var(--accent-soft);color:var(--link);border-color:color-mix(in srgb,var(--link) 30%,transparent)}
.chip svg{width:13px;height:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ai-mini{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:600}
.ai-mini svg{width:15px;height:15px}
.ai-mini.v-genuine{color:var(--ok)} .ai-mini.v-counterfeit{color:var(--bad)} .ai-mini.v-inconclusive{color:var(--warn)}

/* Notices */
.note{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:.9rem;line-height:1.4;color:var(--fg)}
.note>svg{flex:none;margin-top:1px;width:20px;height:20px}
.note.info{background:var(--accent-soft)} .note.info>svg{color:var(--link)}
.note.warn{background:var(--warn-soft)} .note.warn>svg{color:var(--warn)}
.note.ok{background:var(--ok-soft)} .note.ok>svg{color:var(--ok)}
.note.bad{background:var(--bad-soft)} .note.bad>svg{color:var(--bad)}
.note strong{display:block;margin-bottom:2px}
.note div{display:flex;flex-direction:column;gap:6px}

/* Home */
.hero{display:flex;flex-direction:column;gap:14px;padding:20px 18px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.hero h2{font-size:2rem;letter-spacing:-.005em}
.layers{list-style:none;margin:2px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative}
.layers li{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:var(--fg-2-strong);line-height:1.25;position:relative}
.layers li b{font-family:var(--f-mono);font-weight:500;font-size:.8rem;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--link);position:relative;z-index:1}
.layers li:not(:last-child)::after{content:"";position:absolute;top:14px;left:34px;right:-2px;height:2px;background:var(--line)}
.tour{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:14px;border:1.5px dashed var(--btn-line)}
.tour h3{font-size:1.1rem}
.tour p{color:var(--fg-2);font-size:.92rem;margin-top:2px}
.tour-a{display:flex;gap:8px;flex-wrap:wrap}

/* Search + fields */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:.88rem}
.input{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--surface);padding:10px 14px;font-size:1rem;color:var(--fg)}
.input::placeholder{color:var(--fg-2);opacity:.8}
.input:focus{border-color:var(--link);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{min-height:110px;resize:vertical;line-height:1.4}
.search{position:relative}
.search .s-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--fg-2);display:grid}
.search .input{padding-left:44px}

/* Part detail */
.part-head{display:flex;gap:14px;align-items:center}
.part-head .p-big{width:104px;height:104px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:8px;object-fit:contain;flex:none}
.part-head>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.part-head h2{font-size:1.45rem}
.pn{color:var(--fg-2)}
dl.group{margin:0}
.spec .row{justify-content:space-between;gap:12px}
.spec dt{font-size:.92rem}
.spec dd{margin:0;text-align:right;color:var(--fg-2-strong)}
.missing .row{justify-content:space-between;border-style:dashed none none}
.missing{border-style:dashed}

/* Checklist */
.ck-list{list-style:none;margin:0;padding:0}
.ck-item{display:flex;flex-direction:column;gap:10px;padding:14px;border-top:1px solid var(--line)}
.ck-item:first-child{border-top:0}
.ck-h{display:flex;flex-direction:column;gap:2px}
.ck-name{font-weight:600}
.ck-ref{font-size:.86rem;color:var(--fg-2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:.82rem;font-weight:600;color:var(--fg-2);display:flex;align-items:center;justify-content:center;gap:5px;padding:0 4px;line-height:1.15}
.seg button svg{width:15px;height:15px;flex:none}
.seg button[aria-checked="true"].v-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.seg button[aria-checked="true"].v-no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.seg button[aria-checked="true"].v-q{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}

/* Photos */
.prog{display:flex;flex-direction:column;gap:8px}
.views{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.views i{height:6px;border-radius:3px;background:var(--line)}
.views i.on{background:var(--ok)}
.views i.wa{background:var(--warn)}
.shot{gap:12px;padding:10px 12px}
.th{width:66px;height:66px;border-radius:10px;flex:none;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;border:1.5px dashed var(--line-strong);color:var(--link);padding:0}
.th.has{border:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.shot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.shot-name{font-weight:600}
.shot-main .hint{font-size:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.shot-a{display:flex;gap:6px;flex:none}
.extras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ex{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;max-width:100%}
.ex img{width:100%;height:100%;object-fit:cover;display:block}
.ex button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(10,16,22,.65);color:#fff;display:grid;place-items:center;padding:0}
.ex button svg{width:14px;height:14px}
.ex.add{border:1.5px dashed var(--line-strong);background:var(--surface);color:var(--link);display:grid;place-items:center;padding:0}
.demo{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--surface-2)}
.demo p{font-size:.86rem;color:var(--fg-2)}

/* Analysing */
.an{align-items:center;text-align:center;padding-top:36px}
.ring{position:relative;width:132px;height:132px;color:var(--link)}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .r-track{fill:none;stroke:var(--accent-soft);stroke-width:9}
.ring .r-arc{fill:none;stroke:var(--link);stroke-width:9;stroke-linecap:round;stroke-dasharray:90 225;transform-origin:60px 60px;animation:spin 1.1s linear infinite}
.ring>span{position:absolute;inset:0;display:grid;place-items:center}
.ring>span svg{width:40px;height:40px;transform:none}
@keyframes spin{to{transform:rotate(360deg)}}
.an-lead{font-family:var(--f-display);font-size:1.3rem;font-weight:700;color:var(--fg);max-width:28ch}
.an-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;align-self:stretch;text-align:left;padding-inline:24px}
.an-steps li{display:flex;align-items:center;gap:10px;color:var(--fg-2)}
.an-steps li.done{color:var(--ok)}
.an-steps li.on{color:var(--fg);font-weight:600}
.an-steps .dot{width:12px;height:12px;border-radius:50%;background:var(--link);margin:0 2px;animation:pulse 1s ease-in-out infinite alternate}
.an-steps .dot.off{background:transparent;border:2px solid var(--line-strong);animation:none}
.an-steps svg{width:16px;height:16px}
@keyframes pulse{from{opacity:.35}to{opacity:1}}

/* Result */
.verdict{border-radius:18px;padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px;border:1.5px solid}
.verdict.v-g{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.verdict.v-c{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.verdict.v-q{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.v-top{display:flex;align-items:center;gap:12px}
.v-top svg{flex:none}
.vl{font-size:2.1rem;letter-spacing:-.005em;line-height:1}
.v-g .v-top,.v-g .vl{color:var(--ok)}
.v-c .v-top,.v-c .vl{color:var(--bad)}
.v-q .v-top,.v-q .vl{color:var(--warn)}
.verdict p{color:var(--fg);font-size:.95rem}
.src{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.src svg{width:14px;height:14px}
.src.you{color:var(--link)}
.conf{padding:14px;display:flex;flex-direction:column;gap:10px}
.conf-h{display:flex;justify-content:space-between;align-items:baseline;font-weight:600}
.conf-h strong{font-family:var(--f-display);font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.conf-h strong.g{color:var(--ok)} .conf-h strong.c{color:var(--bad)} .conf-h strong.q{color:var(--warn)}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);margin-top:6px}
.gauge b{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.gauge b.f-g{background:var(--ok)} .gauge b.f-c{background:var(--bad)} .gauge b.f-q{background:var(--warn)}
.gauge .tick{position:absolute;top:-7px;bottom:-7px;width:2.5px;margin-left:-1px;background:var(--fg);border-radius:2px}
.gauge-lab{position:relative;height:16px;font-size:.74rem;color:var(--fg-2)}
.gauge-lab span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.gauge-lab .l0{left:0;transform:none}.gauge-lab .l100{right:0;left:auto;transform:none}
.cat-meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.cat-meter span{text-align:center;padding:8px 4px;border-radius:8px;background:var(--surface-2);font-size:.82rem;font-weight:600;color:var(--fg-2);border:1.5px solid transparent}
.cat-meter span.on{background:var(--accent-soft);color:var(--link);border-color:var(--link)}
.tech summary{padding:14px;font-weight:600;cursor:pointer;list-style-position:inside}
.tech .tech-b{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.tech table{width:100%;border-collapse:collapse;font-size:.85rem}
.tech th,.tech td{text-align:left;padding:6px 4px;border-top:1px solid var(--line)}
.tech th{font-weight:600;color:var(--fg-2);font-size:.78rem}
.tech td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.kv-mini{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv-mini dt{color:var(--fg-2)} .kv-mini dd{margin:0;text-align:right}
.err{align-items:center;text-align:center;padding-top:40px}
.err-ic{width:84px;height:84px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--fg-2)}
.err-ic svg{width:42px;height:42px}
.err h2{font-size:1.6rem}
.err>p{color:var(--fg-2);max-width:34ch}

/* Review + summary */
.thumbs{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.thumbs img{width:34px;height:34px;border-radius:6px;object-fit:cover}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.strip img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.strip figcaption{font-size:.74rem;color:var(--fg-2);line-height:1.25}
.res-list .row{justify-content:space-between}
.r-txt{font-size:.95rem}
.quote{white-space:pre-wrap;font-size:.95rem;padding:12px 14px}

/* Settings */
.set{justify-content:space-between}
.set-l{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.set-l label,.set-l>span:first-child{font-size:.97rem}
.sel{min-height:40px;max-width:52%;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);padding:0 10px;font-weight:600;color:var(--link);font-size:.9rem}
.switch{width:52px;height:32px;border-radius:16px;border:0;background:var(--line-strong);position:relative;flex:none;padding:0;transition:background .15s}
.switch i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--btn)}
.switch[aria-checked="true"] i{transform:translateX(20px)}
.val{display:inline-flex;align-items:center;gap:6px;color:var(--fg-2);font-weight:600}
.range-row{flex-direction:column;align-items:stretch;gap:8px}
.range-row .range-h{display:flex;justify-content:space-between;font-weight:600}
input[type="range"]{width:100%;accent-color:var(--btn);min-height:32px}
.pin-row{display:flex;gap:8px}
.pin-row .input{flex:1;min-width:0}
.danger-t{color:var(--bad)}
.about{display:flex;flex-direction:column;gap:4px;text-align:center;color:var(--fg-2);font-size:.82rem;padding-top:4px}

/* Sheets + toast */
.sheet-wrap{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .18s ease-out}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-block:10px 20px;display:flex;flex-direction:column;gap:14px;animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line-strong);margin:0 auto 2px;flex:none}
.sheet h2{font-size:1.45rem}
.sheet p{color:var(--fg-2-strong)}
.sheet-a{display:flex;flex-direction:column;gap:8px}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--fg-2-strong)}
.cap-ill{border-radius:14px;background:var(--surface-2);display:grid;place-items:center;padding:12px}
.cap-ill img{width:180px;height:180px;object-fit:contain}
.q-prev{border-radius:14px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);max-width:100%}
.q-prev img{width:100%;height:100%;object-fit:cover;display:block}
.tour-n{font-family:var(--f-mono);color:var(--link);font-size:.85rem}
.tour-big{font-family:var(--f-display);font-size:4rem;line-height:1;color:var(--link);font-weight:700}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--link)}
.radio-list{display:flex;flex-direction:column;gap:6px}
.radio-list button{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:500}
.radio-list button i{width:18px;height:18px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
.radio-list button[aria-checked="true"]{border-color:var(--link);background:var(--accent-soft)}
.radio-list button[aria-checked="true"] i{border:5px solid var(--link)}
.err-t{color:var(--bad);font-size:.85rem;font-weight:600}
#toast{position:absolute;left:50%;top:76px;transform:translateX(-50%);z-index:50;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:.9rem;font-weight:600;max-width:calc(100% - 32px);width:max-content;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .2s, transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* Banknote additions */
.p-ic{width:88px;height:43px;object-fit:cover;padding:0;border-radius:6px;border:1px solid var(--line)}
.rec-th{object-fit:cover}
.ref-fig{margin:0;display:flex;flex-direction:column;gap:6px}
.ref-fig img{width:100%;border-radius:12px;border:1px solid var(--line);display:block;aspect-ratio:2.07/1;object-fit:cover}
.part-title{display:flex;flex-direction:column;gap:6px}
.part-title h2{font-size:1.6rem}
.spec dd{max-width:60%}
.denoms{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.denoms img{width:100%;aspect-ratio:2.07/1;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.ck-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip.how{background:transparent;border-style:dashed;color:var(--fg-2);font-weight:500}
.mono-in{font-family:var(--f-mono);letter-spacing:.04em}
.cap-ill img{width:100%;height:auto;max-height:200px;object-fit:contain}
.strip img{aspect-ratio:4/3}
.th img{object-fit:cover}
</style>

/* ---------- Helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,10);
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function t(k,v){let s=(T[S.settings.lang]&&T[S.settings.lang][k])??T.en[k]??k;if(v)s=s.replace(/\{(\w+)\}/g,(m,x)=>v[x]??'');return s}
const loc=()=>LOCALE[S.settings.lang]||'en-GB';
const nf=(v,max=2)=>{try{return new Intl.NumberFormat(loc(),{maximumFractionDigits:max}).format(v)}catch(e){return String(v)}};
const pct=n=>S.settings.lang==='fi'?`${n} %`:`${n}%`;
function fmtDate(iso,short){try{return new Intl.DateTimeFormat(loc(),short?{day:'numeric',month:'short'}:{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso))}catch(e){return iso}}
function fmtLen(mm){if(S.settings.units==='imperial'){const v=mm/25.4;return nf(v,2)+' in'}return nf(mm,1)+' mm'}
function refText(f){
 if(f.size)return fmtLen(f.size[0])+' × '+fmtLen(f.size[1]);
 if(f.cols)return f.cols.map(c=>t('c_'+c)).join(', ');
 if(f.words)return '“'+f.words+'”';
 if(f.foil)return t('r_foil',{s:t('foil_'+f.foil)});
 return t(f.tpl)}
const getPart=id=>PARTS.find(p=>p.id===id);
function resolvePart(id,entered){if(id==='UNLISTED'||!getPart(id))return{id:'UNLISTED',unlisted:true,entered:entered||'',features:[],missing:[]};return getPart(id)}
const partOf=x=>x.part||resolvePart(x.partId,x.entered);
const partName=p=>p.unlisted?t('unknown_part'):t('note_name',{v:nf(p.v)});
const pno=p=>p.unlisted?(p.entered||'—'):'UGX '+nf(p.v);
const refStatus=p=>!p.features.length?'none':p.missing.length?'limited':'full';
function photoList(x){if(x.photoList)return x.photoList;return [...VIEWS.filter(v=>x.photos[v]).map(v=>x.photos[v]),...x.extras]}
function makeId(){const d=new Date();const p=n=>String(n).padStart(2,'0');return `UG-${String(d.getFullYear()).slice(2)}${p(d.getMonth()+1)}${p(d.getDate())}-${String(Math.floor(Math.random()*9000)+1000)}`}

function noteCanvas(v,view,o={}){

 if(view==='light'){const g=c.createRadialGradient(W*.5,H*.45,W*.05,W*.5,H*.5,W*.7);g.addColorStop(0,'#FFFBEA');g.addColorStop(1,o.photo?'#B8AD90':'rgba(255,248,225,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
 if(!img){return cv}
 const nw=W*(view==='serial'?2.6:.88),nh=nw*img.naturalHeight/img.naturalWidth;
 c.save();c.translate(W/2,H/2);
 if(view==='serial')c.translate(nw*.35,nh*.27);else if(o.photo)c.rotate((rnd()-.5)*.1);
 if(view==='tilt')c.transform(1,-.07,.3,.78,0,0);
 if(o.photo){c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=W*.03;c.shadowOffsetY=W*.012}
 if(view==='light')c.globalAlpha=.6;
 if(view==='back'){c.fillStyle='#9AA6B2';c.fillRect(-nw/2,-nh/2,nw,nh);c.shadowColor='transparent';c.strokeStyle='#E6ECF2';c.lineWidth=W*.01;c.setLineDash([W*.025,W*.02]);c.strokeRect(-nw/2+W*.03,-nh/2+W*.03,nw-W*.06,nh-W*.06);
  c.setLineDash([]);c.lineWidth=W*.012;c.beginPath();c.arc(0,0,nh*.2,-.4,Math.PI*1.4);c.stroke();c.beginPath();c.moveTo(nh*.2*Math.cos(-.4)+W*.025,nh*.2*Math.sin(-.4)-W*.03);c.lineTo(nh*.2*Math.cos(-.4),nh*.2*Math.sin(-.4));c.lineTo(nh*.2*Math.cos(-.4)-W*.035,nh*.2*Math.sin(-.4)-W*.005);c.stroke()}
 else c.drawImage(img,-nw/2,-nh/2,nw,nh);
 c.shadowColor='transparent';c.globalAlpha=1;
 if(view==='light'){const g=c.createRadialGradient(-nw*.3,0,1,-nw*.3,0,nh*.42);g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(-nw/2,-nh/2,nw,nh)}
 if(view==='tilt'){const g=c.createLinearGradient(-nw/2,-nh/2,nw/2,nh/2);g.addColorStop(.35,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.35)');g.addColorStop(.65,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(-nw/2,-nh/2,nw,nh)}

function loadImage(src){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('decode'));im.src=src})}
function drawTo(im,max){const W=im.naturalWidth||im.width,H=im.naturalHeight||im.height;const s=Math.min(1,max/Math.max(W,H));const w=Math.max(1,Math.round(W*s)),h=Math.max(1,Math.round(H*s));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return c}
function analyze(im){const c=drawTo(im,160);const x=c.getContext('2d');const w=c.width,h=c.height;const d=x.getImageData(0,0,w,h).data;const g=new Float32Array(w*h);let sum=0;
 for(let i=0,j=0;i<d.length;i+=4,j++){const v=.299*d[i]+.587*d[i+1]+.114*d[i+2];g[j]=v;sum+=v}const lum=sum/(w*h);
 let m=0,m2=0,n=0;for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){const k=y*w+xx;const L=4*g[k]-g[k-1]-g[k+1]-g[k-w]-g[k+w];m+=L;m2+=L*L;n++}const sharp=n?(m2/n-(m/n)**2):0;
 const c8=document.createElement('canvas');c8.width=c8.height=8;const x8=c8.getContext('2d');x8.drawImage(c,0,0,8,8);const d8=x8.getImageData(0,0,8,8).data;const a=[];let avg=0;for(let i=0;i<64;i++){const v=d8[i*4]+d8[i*4+1]+d8[i*4+2];a.push(v);avg+=v}avg/=64;
 let q='ok';if(lum<50)q='dark';else if(lum>225)q='bright';else if(sharp<14)q='blur';
 return{lum:Math.round(lum),sharp:Math.round(sharp),hash:a.map(v=>v>avg?1:0).join(''),q}}
async function ingest(src,view,sample){let url=src,obj=null;
 if(typeof src!=='string'){if(src.type&&!src.type.startsWith('image/'))throw new Error('type');obj=url=URL.createObjectURL(src)}
 try{const im=await loadImage(url);const a=analyze(im);const W=im.naturalWidth,H=im.naturalHeight;
  return{id:uid(),view,preview:drawTo(im,560).toDataURL('image/jpeg',.82),thumb:drawTo(im,220).toDataURL('image/jpeg',.72),...a,w:W,h:H,uploadPx:Math.min(Math.max(W,H),S.settings.upq==='low'?800:1600),sample:!!sample,keep:false}}
 finally{if(obj)setTimeout(()=>URL.revokeObjectURL(obj),2000)}}

/* ---------- Model adapter (UI-31, UI-87) ----------
   INTEGRATION POINT: replace the body of classify() with a call to the trained banknote model, for example
     const fd=new FormData(); images.forEach(im=>fd.append('images', blobFrom(im.preview), im.view+'.jpg'));
     const r=await fetch(API_URL+'/classify?denomination='+note.v,{method:'POST',body:fd});
     if(!r.ok) throw {code:'service'}; const j=await r.json();   // expected {p_genuine, per_image:[{view,p}], model_version}
   Training data: UGX banknote dataset (Mendeley Data). Known bias: camera model is linked to class (Cramér's V ≈ 0.29),
   so balance or stratify by device before trusting accuracy figures.
   This preview blocks network calls to other hosts, so the prototype simulates the model on the device. */
async function classify(x){
 const imgs=photoList(x);const p0=partOf(x);const mode=S.settings.demo;
 if(mode==='error'){await sleep(1200);throw{code:'service'}}
 if(!imgs.some(i=>i.q==='ok'))return{error:'unreliable'};
 const R=rng(hashStr(imgs.map(i=>i.hash).join('')+p0.id));
 const forced=['genuine','counterfeit','inconclusive'].includes(mode);
 let base;
 if(mode==='genuine')base=.92;else if(mode==='counterfeit')base=.11;else if(mode==='inconclusive')base=.6;
 else if(imgs.every(i=>i.sample))base=.93;
 else{const r=R();base=r<.5?.82+R()*.14:r<.75?.38+R()*.26:.05+R()*.18}
 const covered=VIEWS.filter(v=>imgs.some(i=>i.view===v)).length;const bad=imgs.filter(i=>i.q!=='ok').length;const unsupported=!p0.features.length;
 let shrink=1-.08*(VIEWS.length-covered)-.12*bad-(unsupported?.3:0)-(S.settings.upq==='low'?.04:0);
 if(forced)shrink=1;shrink=Math.max(.2,shrink);
 const p=.5+(base-.5)*shrink;const confPct=Math.round(Math.max(p,1-p)*100);const thr=S.settings.threshold;
 const label=confPct<thr?'inconclusive':(p>=.5?'genuine':'counterfeit');
 const notes=[];if(!forced&&unsupported)notes.push('unsupported');if(!forced&&(covered<VIEWS.length||bad))notes.push('lowq');
 return{p,conf:confPct/100,label,threshold:thr,perImage:imgs.map(i=>({view:i.view,q:i.q,p:clamp(p+(R()-.5)*(i.q==='ok'?.1:.3),.01,.99)})),model:MODEL,simulated:true,uploadPx:Math.max(...imgs.map(i=>i.uploadPx||0)),notes}}

 <div class="field"><label for="q">${t('id_label')}</label><div class="search"><span class="s-ic">${I.search}</span><input id="q" class="input" type="search" autocomplete="off" spellcheck="false" placeholder="${esc(t('id_ph'))}" value="${esc(S.query)}"></div></div>
 <div id="results" class="stack">${results()}</div>
</div></main>`},

part(){const p=S.insp.part;const row=(l,v)=>v?`<div class="row"><dt>${l}</dt><dd>${esc(v)}</dd></div>`:'';return `${bar({title:t('pd_title'),sub:`<span class="mono">${esc(pno(p))}</span>`,back:'to-identify',close:true,step:0})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 <figure class="ref-fig"><img src="${noteIcon(p)}" alt="${esc(partName(p))}"><figcaption class="hint">${t('pd_specimen')}</figcaption></figure>
 <div class="part-title"><p class="eyebrow">${t('demo_set')}</p><h2>${esc(partName(p))}</h2>${refChip(p)}</div>
 <section class="section"><h3 class="h3">${t('pd_ref')}</h3><dl class="group spec">
  <div class="row"><dt>${t('pd_size')}</dt><dd class="mono">${esc(fmtLen(p.w)+' × '+fmtLen(p.h))}</dd></div>
  ${row(t('pd_colours'),p.cols.map(c=>t('c_'+c)).join(', '))}
  <div class="row"><dt>${t('pd_text')}</dt><dd class="mono">${esc(p.words)}</dd></div>
  ${row(t('pd_place'),p.place)}${row(t('pd_landmark'),p.landmark)}${row(t('pd_animal'),p.animal)}${row(t('pd_objects'),p.objects)}
 </dl></section>
 <section class="section"><h3 class="h3">${t('pd_features')}</h3><div class="chips">${p.features.slice(3).map(f=>`<span class="chip">${HOW[f.how]}${t(f.k)}</span>`).join('')}</div></section>
 <section class="section"><h3 class="h3">${t('pd_views')}</h3><div class="chips">${VIEWS.map(v=>`<span class="chip">${t('v_'+v)}</span>`).join('')}</div></section>
</div></main>
<footer class="foot gut"><button class="btn primary" data-act="to-check">${t('pd_start')}</button><button class="btn ghost" data-act="to-photos">${t('pd_skip')}</button></footer>`},

checklist(){const x=S.insp,p=x.part,ck=x.checklist,n=p.features.length,a=p.features.filter(f=>ck[f.k]).length,no=p.features.filter(f=>ck[f.k]==='no').length,q=p.features.filter(f=>ck[f.k]==='q').length;
 const msg=a<n?`<div class="note info">${I.info}<span>${t('ck_todo')}</span></div>`:(!no&&!q)?`<div class="note ok">${VI.genuine(20)}<span>${t('ck_all_ok')}</span></div>`:`<div class="note warn">${I.warn}<span>${t('ck_incon',{x:no,y:q})}</span></div>`;
 return `${bar({title:t('ck_title'),sub:`<span class="mono">${esc(pno(p))}</span> · ${t('ck_answered',{a,n})}`,back:'to-part',close:true,step:1})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 <p class="lead">${t('ck_lead')}</p>
 <ul class="group ck-list">${p.features.map(f=>`<li class="ck-item"><div class="ck-h"><div class="ck-top"><span class="ck-name">${t(f.k)}</span>${howChip(f.how)}</div><span class="ck-ref">${t('ck_ref')}: <span class="${f.size||f.words?'mono':''}">${esc(refText(f))}</span></span></div>
  <div class="seg" role="radiogroup" aria-label="${esc(t(f.k))}">${['ok','no','q'].map(v=>`<button role="radio" aria-checked="${ck[f.k]===v}" class="v-${v}" data-act="ck" data-k="${f.k}" data-v="${v}">${v==='ok'?I.check:v==='no'?I.x:I.q}${t('ck_'+v)}</button>`).join('')}</div></li>`).join('')}</ul>
 ${msg}
</div></main>
<footer class="foot gut"><button class="btn primary" data-act="to-photos">${t('ck_continue')}</button>${a===n?`<button class="btn ghost" data-act="finish-manual">${t('ck_finish')}</button>`:''}</footer>`},

photos(){const x=S.insp,p=partOf(x),covered=VIEWS.filter(v=>x.photos[v]).length,total=covered+x.extras.length,missing=VIEWS.length-covered;
 const row=v=>{const im=x.photos[v];return `<div class="row shot"><button class="th${im?' has':''}" data-act="cap" data-view="${v}" aria-label="${esc((im?t('ph_retake'):t('ph_take'))+': '+t('v_'+v))}">${im?`<img src="${im.thumb}" alt="">`:I.plus}</button>
  <div class="shot-main"><span class="shot-name">${t('v_'+v)}</span>${im?qChip(im):`<span class="hint">${t('tip_'+v)}</span>`}</div>
  ${im?`<div class="shot-a"><button class="mini" data-act="cap" data-view="${v}">${t('ph_retake')}</button><button class="mini icon" data-act="rm" data-view="${v}" aria-label="${esc(t('ph_remove')+': '+t('v_'+v))}">${I.trash}</button></div>`:''}</div>`};
 return `${bar({title:t('ph_title'),sub:`<span class="mono">${esc(pno(p))}</span>`,back:p.unlisted?'to-identify':'to-check',help:true,close:true,step:2})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 <p class="lead">${t('ph_lead')}</p>
 <div class="prog"><div class="views" aria-hidden="true">${VIEWS.map(v=>`<i class="${x.photos[v]?(x.photos[v].q==='ok'?'on':'wa'):''}"></i>`).join('')}</div><span class="eyebrow">${t('ph_count',{a:covered,n:VIEWS.length})}</span></div>
 <div class="group">${VIEWS.map(row).join('')}</div>
 <section class="section"><h3 class="h3">${t('ph_extra_t')}</h3><div class="extras">${x.extras.map((im,i)=>`<div class="ex"><img src="${im.thumb}" alt="${esc(t('v_extra'))}"><button data-act="rm" data-idx="${i}" aria-label="${esc(t('ph_remove'))}">${I.x}</button></div>`).join('')}<button class="ex add" data-act="cap" data-view="extra" aria-label="${esc(t('ph_add'))}">${I.plus}</button></div></section>
 ${covered<VIEWS.length&&!p.unlisted?`<div class="demo"><p>${t('ph_sample_d')}</p><button class="btn secondary sm" data-act="sample">${I.img}${t('ph_sample')}</button></div>`:''}
 ${total&&missing?`<div class="note warn">${I.warn}<span>${t('ph_missing',{m:missing})}</span></div>`:''}
</div></main>
<footer class="foot gut"><button class="btn primary" data-act="submit"${total&&!S.busy?'':' disabled'}>${t('ph_submit')}</button><p class="fine">${total?'':t('ph_none')+' · '}<button class="link" style="min-height:0;padding:0;font-size:inherit" data-act="privacy">${t('ph_privacy')}</button></p></footer>`},

analysing(){const a=S.an,p=partOf(S.insp);return `${bar({title:t('an_t'),sub:`<span class="mono">${esc(pno(p))}</span>`,step:3})}
<main class="scroll" id="scroll"><div class="pad gut stack an">
 <div class="ring" aria-hidden="true"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" class="r-track"/><circle cx="60" cy="60" r="50" class="r-arc"/></svg><span>${I.scan}</span></div>
 <p class="an-lead" role="status">${t('an_d',{n:a.n})}</p>
 <ol class="an-steps">${['an_1','an_2','an_3','an_4'].map((k,i)=>`<li class="${i<a.step?'done':i===a.step?'on':''}">${i<a.step?I.check:`<span class="dot${i===a.step?'':' off'}"></span>`}${t(k)}</li>`).join('')}</ol>
 ${a.slow?`<div class="note warn" style="text-align:left">${I.warn}<span>${t('an_slow')}</span></div>`:''}
</div></main><footer class="foot gut"><button class="btn secondary" data-act="cancel-an">${t('an_cancel')}</button></footer>`},

result(){const x=S.insp,r=x.ai,p=partOf(x),L=r.label,cls={genuine:'g',counterfeit:'c',inconclusive:'q'}[L],cp=Math.round(r.conf*100),below=cp<r.threshold,cat=cp>=85?'high':cp>=r.threshold?'med':'low',catMode=S.settings.display==='cat';
 const gauge=catMode?`<div class="cat-meter">${['low','med','high'].map(c=>`<span class="${c===cat?'on':''}">${t('res_cat_'+c)}</span>`).join('')}</div>`
  :`<div class="gauge" role="img" aria-label="${esc(t('res_conf')+' '+pct(cp)+', '+t('res_thr',{t:r.threshold}))}"><b class="f-${cls}" style="width:${cp}%"></b><i class="tick" style="left:${r.threshold}%"></i></div><div class="gauge-lab"><span class="l0">0</span><span style="left:${r.threshold}%">${t('res_thr',{t:r.threshold})}</span><span class="l100">100</span></div>`;
 const c=ckCounts(x);
 const acts=L==='genuine'?`<button class="btn primary" data-act="finish">${t('res_finish')}</button><button class="btn ghost" data-act="to-review">${t('res_review_any')}</button>`
  :`<button class="btn primary" data-act="to-review">${t('res_review')}</button><div class="foot-row"><button class="btn secondary" data-act="to-photos">${t('res_retake')}</button><button class="btn secondary" data-act="finish">${t('res_finish')}</button></div>`;
 return `${bar({title:t('res_t'),sub:`<span class="mono">${esc(pno(p))}</span>`,close:true,step:3})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 <section class="verdict v-${cls}"><span class="src">${I.scanS}${t('sm_ai_src')}</span><div class="v-top">${VI[L](42)}<h2 class="vl">${t('res_'+L)}</h2></div><p>${t('res_'+L+'_d')}</p></section>
 ${L==='counterfeit'?`<div class="note bad">${VI.counterfeit(20)}<span>${t('res_cf')}</span></div>`:''}
 <section class="group conf"><div class="conf-h"><span>${t('res_conf')}</span><strong class="${cls}">${catMode?t('res_cat_'+cat):pct(cp)}</strong></div>${gauge}
  ${L==='counterfeit'?'':`<p class="hint">${below?t('res_below'):t('res_above')}</p>`}</section>
 ${r.notes.map(n=>`<div class="note warn">${I.warn}<span>${t(n==='unsupported'?'res_unsupported':'res_lowq')}</span></div>`).join('')}
 <div class="note info">${I.info}<span>${t('res_disclaimer')}</span></div>
 ${c.n?`<section class="group" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span class="src you">${I.user}${t('sm_you')} · ${t('rv_check')}</span>${ckSummary(x)}</section>`:''}
 <details class="group tech"><summary>${t('res_details')}</summary><div class="tech-b">
  <p class="hint">${t('res_sim')}</p>
  <dl class="kv-mini"><dt>${t('res_model')}</dt><dd class="mono">${esc(r.model)}</dd><dt>${t('res_score')}</dt><dd class="mono">${nf(r.p,2)}</dd><dt>${t('s_thr')}</dt><dd class="mono">${pct(r.threshold)}</dd><dt>${t('res_time')}</dt><dd class="mono">${nf((r.ms||0)/1000,1)} s</dd><dt>${t('res_upload')}</dt><dd class="mono">${r.uploadPx} px</dd></dl>
  <p class="hint">${t('res_score_d')}</p>
  <table><thead><tr><th>${t('res_per')}</th><th>${t('res_quality')}</th><th style="text-align:right">${t('res_score')}</th></tr></thead><tbody>${r.perImage.map(i=>`<tr><td>${t('v_'+i.view)}</td><td>${t('q_'+i.q)}</td><td class="num">${nf(i.p,2)}</td></tr>`).join('')}</tbody></table>
  <div class="note warn">${I.warn}<span>${t('res_bias')}</span></div>
 </div></details>
 <button class="link center" data-act="report">${I.flag}${t('res_report')}</button>
</div></main><footer class="foot gut">${acts}</footer>`},

error(){const k=S.err,p=partOf(S.insp);return `${bar({title:t('res_t'),sub:`<span class="mono">${esc(pno(p))}</span>`,close:true,step:3})}
<main class="scroll" id="scroll"><div class="pad gut stack err">
 <div class="err-ic">${k==='unreliable'?I.warn:I.cloud}</div><h2>${k==='unreliable'?t('er_unrel_t'):t('er_t')}</h2>
 <p>${k==='wifi'?t('er_wifi'):k==='unreliable'?t('er_unrel'):t('er_service')}</p>
 ${k!=='unreliable'?`<div class="note info" style="text-align:left">${I.info}<span>${t('er_note')}</span></div>`:''}
</div></main><footer class="foot gut">${k!=='unreliable'?`<button class="btn primary" data-act="retry">${t('er_retry')}</button>`:''}<button class="btn ${k!=='unreliable'?'secondary':'primary'}" data-act="to-photos">${t('er_back')}</button></footer>`},

review(){const x=S.insp,p=partOf(x),pl=photoList(x);return `${bar({title:t('rv_t'),sub:`<span class="mono">${esc(pno(p))}</span>`,back:x.fromRecord?'to-summary':'to-result',close:!x.fromRecord})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 <p class="lead">${t('rv_lead')}</p>
 <section class="section"><h3 class="h3">${t('rv_inc')}</h3><div class="group">
  <div class="row kv"><span>${t('rv_part')}</span><span class="mono">${esc(pno(p))}</span></div>
  <div class="row kv"><span>${t('rv_photos')}</span><span class="thumbs">${pl.length?pl.slice(0,6).map(i=>`<img src="${i.thumb}" alt="${esc(t('v_'+i.view))}">`).join(''):`<span class="hint">${t('rv_none')}</span>`}</span></div>
  <div class="row kv"><span>${t('rv_check')}</span>${ckSummary(x)}</div>
  <div class="row kv"><span>${t('rv_ai')}</span>${x.ai?aiMini(x.ai):`<span class="hint">${t('rv_none')}</span>`}</div>
 </div></section>
 <section class="field"><label for="rv_obs">${t('rv_obs')}</label><textarea id="rv_obs" class="input" data-rv="obs" placeholder="${esc(t('rv_obs_ph'))}">${esc(S.rvDraft.obs)}</textarea></section>
 <section class="section"><h3 class="h3">${t('rv_ctx')}</h3>${[['serial','text'],['source','text'],['count','number']].map(([k,ty])=>`<div class="field"><label for="rv_${k}">${t('rv_'+k)}</label><input id="rv_${k}" class="input${k==='serial'?' mono-in':''}" type="${ty}" ${k==='count'?'inputmode="numeric" min="1"':'autocapitalize="characters"'} data-rv="${k}" placeholder="${esc(t('rv_'+k+'_ph'))}" value="${esc(S.rvDraft[k])}"></div>`).join('')}</section>
</div></main><footer class="foot gut"><button class="btn primary" data-act="send-review">${I.send}${t('rv_send')}</button></footer>`},

summary(){const r=S.rec,p=partOf(r),pl=r.photoList||[],c=ckCounts(r);const resIcon=v=>v==='ok'?`<span class="chip ok">${I.check}${t('ck_ok')}</span>`:v==='no'?`<span class="chip bad">${I.x}${t('ck_no')}</span>`:`<span class="chip warn">${I.q}${t('ck_q')}</span>`;
 return `${bar({title:t('sm_t'),sub:`<span class="mono">${esc(r.id)}</span>${r.example?' · '+t('example'):''}`,back:S.recFrom==='history'?'back-history':null})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 ${r.status==='review'?`<section class="note info">${I.clock}<div><strong>${t('rv_sent')}</strong><span>${t('rv_sent_d')}</span><span class="hint">${t('rv_demo')}</span><span class="hint">${t('rv_contact',{id:esc(r.id)})}</span></div></section>`:''}
 <div class="group">
  <div class="row kv"><span>${t('sm_status')}</span>${statusChip(r.status)}</div>
  <div class="row kv"><span>${t('sm_id')}</span><span class="mono">${esc(r.id)}</span></div>
  <div class="row kv"><span>${t('sm_date')}</span><span>${fmtDate(r.created)}</span></div>
  <div class="row kv"><span>${t('rv_part')}</span><span class="r-txt">${esc(partName(p))}</span></div>
 </div>
 ${pl.length?`<section class="section"><h3 class="h3">${t('rv_photos')}</h3><div class="strip">${pl.map(i=>`<figure><img src="${i.thumb}" alt="${esc(t('v_'+i.view))}"><figcaption>${t('v_'+i.view)}${i.q!=='ok'?' · '+t('q_'+i.q):''}</figcaption></figure>`).join('')}</div></section>`:''}
 ${r.ai?`<section class="section"><span class="src">${I.scanS}${t('sm_ai_src')}</span><div class="group"><div class="row kv"><span>${t('rv_ai')}</span>${aiMini(r.ai)}</div><div class="row kv"><span>${t('s_thr')}</span><span class="mono">${pct(r.ai.threshold)}</span></div><div class="row kv"><span>${t('res_model')}</span><span class="mono">${esc(r.ai.model)}</span></div></div></section>`:''}
 ${c.n?`<section class="section"><span class="src you">${I.user}${t('sm_you')} · ${t('rv_check')}</span><div class="group res-list">${Object.entries(r.checklist).map(([k,v])=>`<div class="row"><span>${t(k)}</span>${resIcon(v)}</div>`).join('')}</div></section>`:''}
 ${r.review?`<section class="section"><span class="src you">${I.user}${t('sm_you')} · ${t('sm_obs')}</span><div class="group">${r.review.obs?`<p class="quote">${esc(r.review.obs)}</p>`:''}${[['serial','rv_serial'],['source','rv_source'],['count','rv_count']].filter(([k])=>r.review[k]).map(([k,l])=>`<div class="row kv"><span>${t(l)}</span><span class="${k==='serial'?'mono':''}">${esc(r.review[k])}</span></div>`).join('')}${!r.review.obs&&!r.review.serial&&!r.review.source&&!r.review.count?`<p class="quote hint">${t('sm_none')}</p>`:''}</div></section>`:''}
 ${r.status!=='review'?`<button class="btn secondary" data-act="escalate">${t('sm_escalate')}</button>`:''}
</div></main>
<footer class="foot gut"><div class="foot-row">${S.dl?`<button class="btn secondary sm" style="width:100%" data-act="export">${I.download}${t('sm_export')}</button>`:''}<button class="btn secondary sm" style="width:100%${S.dl?'':';grid-column:1/-1'}" data-act="copy">${I.copy}${t('sm_copy')}</button></div>${S.recFrom==='flow'?`<button class="btn primary" data-act="close-rec">${t('sm_close')}</button>`:''}</footer>`},

history(){return `${bar({title:t('hi_t'),sub:S.history.length?t('hi_n',{n:S.history.length}):''})}
<main class="scroll" id="scroll"><div class="pad gut stack">${S.history.length?`<div class="group">${S.history.map(recRow).join('')}</div>`:`<div class="empty-state">${I.clock}<p>${t('hi_empty')}</p><button class="btn primary sm" data-act="start">${t('start')}</button></div>`}</div></main>${tabs('history')}`},

settings(){const s=S.settings;
 const sel=(k,opts)=>`<select id="set_${k}" class="sel" data-set="${k}">${opts.map(([v,l])=>`<option value="${v}"${String(s[k])===String(v)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
 const selRow=(k,label,opts,desc)=>`<div class="row set"><span class="set-l"><label for="set_${k}">${label}</label>${desc?`<span class="hint">${desc}</span>`:''}</span>${sel(k,opts)}</div>`;
 const tog=(k,label,desc)=>`<div class="row set"><span class="set-l"><span id="lb_${k}">${label}</span>${desc?`<span class="hint">${desc}</span>`:''}</span><button class="switch" role="switch" aria-checked="${!!s[k]}" aria-labelledby="lb_${k}" data-act="tog" data-k="${k}"><i></i></button></div>`;
 const link=(act,label,danger)=>`<button class="row set" data-act="${act}"><span class="${danger?'danger-t':''}">${label}</span>${I.chev}</button>`;
 const sec=(title,body)=>`<section class="section"><h3 class="eyebrow">${title}</h3><div class="group">${body}</div></section>`;
 return `${bar({title:t('set_t')})}
<main class="scroll" id="scroll"><div class="pad gut stack">
 ${sec(t('sec_lang'),selRow('lang',t('s_lang'),Object.entries(LANGS))+selRow('units',t('s_units'),[['metric',t('u_metric')],['imperial',t('u_imperial')]])+`<div class="row set"><span class="set-l"><span>${t('s_date')}</span><span class="hint">${t('s_date_d')}</span></span><span class="val">${fmtDate(new Date().toISOString())}</span></div>`)}
 ${sec(t('sec_look'),selRow('theme',t('s_theme'),[['system',t('th_system')],['light',t('th_light')],['dark',t('th_dark')]])+tog('large',t('s_large'))+tog('hc',t('s_hc'),t('s_hc_d')))}
 ${sec(t('sec_photo'),tog('tips',t('s_tips'))+tog('quality',t('s_quality')))}
 ${sec(t('sec_data'),tog('wifi',t('s_wifi'))+selRow('upq',t('s_upq'),[['std',t('upq_std')],['low',t('upq_low')]],s.upq==='low'?t('upq_low_d'):''))}
 ${sec(t('sec_res'),selRow('display',t('s_disp'),[['pct',t('disp_pct')],['cat',t('disp_cat')]])+(S.admin?`<div class="row set range-row"><div class="range-h"><label for="thr">${t('s_thr')}</label><span class="mono" id="thrVal">${pct(s.threshold)}</span></div><input type="range" id="thr" min="50" max="95" step="5" value="${s.threshold}"><span class="hint">${t('ad_thr_d')}</span></div>`:`<div class="row set"><span class="set-l"><span>${t('s_thr')}</span><span class="hint">${t('s_thr_lock')}</span></span><span class="val mono">${pct(s.threshold)} ${I.lock}</span></div>`))}
 ${sec(t('sec_admin'),S.admin?selRow('demo',t('s_demo'),[['auto',t('do_auto')],['genuine',t('do_genuine')],['counterfeit',t('do_counterfeit')],['inconclusive',t('do_inconclusive')],['error',t('do_error')],['slow',t('do_slow')]])+link('admin-lock',t('ad_lock'))
  :`<div class="row set range-row"><label for="pin" class="set-l">${t('ad_unlock')}</label><div class="pin-row"><input id="pin" class="input" type="password" inputmode="numeric" autocomplete="off" placeholder="${esc(t('ad_pin'))}" aria-describedby="pinHint"><button class="btn primary sm" data-act="pin-ok">${t('ad_ok')}</button></div><span class="hint" id="pinHint">${S.pinErr?`<span class="err-t">${t('ad_wrong')}</span> `:''}${t('ad_pin_hint')}</span></div>`)}
 ${sec(t('sec_priv'),link('privacy',t('s_priv'))+link('del-history',t('s_del'),true))}
 ${sec(t('sec_help'),link('tour',t('s_tour'))+link('tips',t('s_tips_open'))+link('feedback',t('s_fb'))+link('lic',t('s_lic'))+link('reset',t('s_reset'),true))}
 <div class="about"><span>${t('ab_app')}: <span class="mono">${APP_VERSION}</span></span><span>${t('ab_model')}: <span class="mono">${MODEL}</span></span>${s.lang!=='en'?`<span>${t('ab_trans')}</span>`:''}</div>
</div></main>${tabs('settings')}`},
};
function qChip(im){return im.q==='ok'?`<span class="chip ok">${I.check}${t('q_ok')}</span>`:`<span class="chip warn">${I.warn}${t('q_'+im.q)}</span>`}
function results(){const q=S.query.trim().toLowerCase().replace(/[\s.,]/g,'');const hay=p=>[String(p.v),p.words,p.place,p.landmark,p.animal||'',p.objects,...p.cols,...p.cols.map(c=>t('c_'+c)),partName(p)].join(' ').toLowerCase();
 const list=q?PARTS.filter(p=>hay(p).replace(/[\s.,]/g,'').includes(q)||hay(p).includes(S.query.trim().toLowerCase())):PARTS;
 const head=q?(list.length===1?t('id_count1'):t('id_count',{n:list.length})):t('id_all');
 return `<div class="section"><span class="eyebrow">${head}</span>${list.length?`<div class="group">${list.map(p=>`<button class="row" data-act="pick" data-id="${p.id}"><img class="p-ic" src="${noteIcon(p)}" alt=""><span class="rec-main"><span class="rec-name">${esc(partName(p))}</span><span class="rec-meta">${esc(p.animal||p.place)} · ${p.cols.map(c=>t('c_'+c)).join(', ')}</span></span>${I.chev}</button>`).join('')}</div>`:`<div class="note warn">${I.warn}<span>${t('id_none',{q:esc(S.query.trim())})}</span></div>`}</div>
 <button class="btn secondary" data-act="noref">${t('id_noref')}</button>`}

function renderNotes(){const n=NOTES[S.screen]||NOTES.home;$('#notes').innerHTML=`<p class="eyebrow">Prototype notes</p><h2>${n[0]}</h2><p class="ids mono">${n[1]}</p><p>${n[2]}</p><hr>
 <h3>Try it</h3><ul><li>On the photo step, tap <b>Use sample photos</b> to run the flow without a camera. The tilted sample is deliberately dark to show the quality warning.</li><li>Settings → Administrator, PIN <code>1234</code>: change the threshold or force a result (genuine, counterfeit, inconclusive, service failure, slow response).</li><li>Switch between English, Kiswahili and Finnish in Settings.</li></ul>
 <h3>Data</h3><p>Reference data: the team’s Banknotes document (Bank of Uganda 2010 series). Training set: UGX banknote dataset on Mendeley Data.</p><p>Known issue: phone model is linked to class (Cramér’s V ≈ 0.29, p &lt; 0.001), so a model could learn the camera instead of the note. Balance or stratify by device before reporting accuracy.</p>
 <h3>Model</h3><p>The classifier is simulated in the browser. Replace <code>classify()</code> with a call to your trained model’s API when the app is hosted outside this preview.</p>`}
function render(reset){const sc=$('#scroll');const top=sc?sc.scrollTop:0;const same=S._key===S.screen;app.innerHTML=SCREENS[S.screen]();const n=$('#scroll');if(n&&same&&!reset)n.scrollTop=top;S._key=S.screen;renderNotes()}
function go(screen){S.screen=screen;S.sheet=null;renderSheet();render(true)}
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}

/* ---------- Sheets ---------- */
function openSheet(s){S.sheet=s;renderSheet()}
function closeSheet(){const ret=S.sheet&&S.sheet.ret;S.sheet=null;if(ret)openSheet(ret);else renderSheet()}
function renderSheet(){const root=$('#sheetRoot');const s=S.sheet;if(!s){root.innerHTML='';return}let b='';const P=()=>S.insp?partOf(S.insp):PARTS[5];
 switch(s.type){
 case 'capture':b=`<h2 id="sh_t">${t('v_'+s.view)}</h2><div class="cap-ill"><img src="${viewIllus(P(),s.view)}" alt=""></div><p>${t('tip_'+s.view)}</p>
  <div class="sheet-a"><button class="btn primary" data-act="take">${I.cam}${t('ph_take')}</button><button class="btn secondary" data-act="gallery">${I.img}${t('ph_choose')}</button><button class="btn ghost" data-act="sheet-close">${t('cancel')}</button></div>`;break;
 case 'quality':b=`<h2 id="sh_t">${t('q_'+s.img.q)}</h2><div class="q-prev"><img src="${s.img.preview}" alt="${esc(t('v_'+s.img.view))}"></div><p>${t('q_'+s.img.q+'_d')}</p>
  <div class="sheet-a"><button class="btn primary" data-act="q-retake">${I.cam}${t('ph_retake')}</button><button class="btn secondary" data-act="q-keep">${t('q_keep')}</button></div>`;break;
 case 'tips':b=`<h2 id="sh_t">${t('tips_t')}</h2><ol>${[1,2,3,4,5].map(i=>`<li>${t('tips_'+i)}</li>`).join('')}</ol><div class="note info">${I.info}<span>${t('tips_more')}</span></div><div class="sheet-a"><button class="btn primary" data-act="sheet-close">${t('done')}</button></div>`;break;
 case 'tour':{const i=s.i;b=`<p class="tour-n">${t('tut_of',{n:i+1})}</p><span class="tour-big">${i+1}</span><h2 id="sh_t">${t('tut'+(i+1)+'_t')}</h2><p>${t('tut'+(i+1)+'_d')}</p>${i===2?`<div class="note info">${I.info}<span>${t('tut_note')}</span></div>`:''}
  <div class="dots" aria-hidden="true">${[0,1,2].map(k=>`<i class="${k===i?'on':''}"></i>`).join('')}</div><div class="sheet-a">${i<2?`<button class="btn primary" data-act="tour-next">${t('tut_next')}</button>`:`<button class="btn primary" data-act="tour-done">${t('tut_go')}</button>`}<button class="btn ghost" data-act="tour-done">${t('close')}</button></div>`;break}
 case 'consent':b=`<h2 id="sh_t">${t('pv_t')}</h2><p>${t('pv_d')}</p><div class="note info">${I.info}<span>${t('pv_proto')}</span></div><div class="sheet-a"><button class="btn primary" data-act="agree">${t('pv_ok')}</button><button class="btn ghost" data-act="privacy-from-consent">${t('pv_more')}</button></div>`;break;
 case 'privacy':b=`<h2 id="sh_t">${t('priv_t')}</h2><ul>${[1,2,3,4].map(i=>`<li>${t('priv_'+i)}</li>`).join('')}</ul><div class="sheet-a"><button class="btn primary" data-act="sheet-close">${s.ret?t('back'):t('close')}</button></div>`;break;
 case 'lic':b=`<h2 id="sh_t">${t('lic_t')}</h2><ul>${[1,2,3,4].map(i=>`<li>${t('lic_'+i)}</li>`).join('')}</ul><div class="sheet-a"><button class="btn primary" data-act="sheet-close">${t('close')}</button></div>`;break;
 case 'feedback':{const f=S.fbDraft;b=`<h2 id="sh_t">${t('fb_t')}</h2><span class="eyebrow">${t('fb_about')}</span><div class="radio-list" role="radiogroup" aria-label="${esc(t('fb_about'))}">${[['wrong','fb_wrong'],['bug','fb_bug'],['idea','fb_idea']].map(([v,l])=>`<button role="radio" aria-checked="${f.type===v}" data-act="fb-type" data-v="${v}"><i></i>${t(l)}</button>`).join('')}</div>
  <div class="field"><label for="fb_text">${t('fb_text')}</label><textarea id="fb_text" class="input" placeholder="${esc(t('fb_ph'))}">${esc(f.text)}</textarea>${S.fbErr?`<span class="err-t">${t('fb_need')}</span>`:''}</div>
  <div class="sheet-a"><button class="btn primary" data-act="fb-send">${t('fb_send')}</button><button class="btn ghost" data-act="sheet-close">${t('cancel')}</button></div>`;break}
 case 'confirm':b=`<h2 id="sh_t">${s.title}</h2><p>${s.desc}</p><div class="sheet-a"><button class="btn ${s.danger?'danger':'primary'}" data-act="${s.act}">${s.ok}</button><button class="btn ghost" data-act="sheet-close">${t('cancel')}</button></div>`;break;
 case 'copytext':b=`<h2 id="sh_t">${t('sm_copy')}</h2><p class="hint">${t('sm_copy_fail')}</p><textarea id="copyArea" class="input" style="min-height:220px" readonly>${esc(s.text)}</textarea><div class="sheet-a"><button class="btn primary" data-act="sheet-close">${t('done')}</button></div>`;break;
 }
 root.innerHTML=`<div class="sheet-wrap" data-act="sheet-bg"><div class="sheet gut" role="dialog" aria-modal="true" aria-labelledby="sh_t"><div class="grab"></div>${b}</div></div>`;
 const f=root.querySelector('.sheet button, .sheet textarea');if(f)setTimeout(()=>{try{f.focus({preventScroll:true})}catch(e){}},30);
 if(s.type==='copytext'){const a=$('#copyArea');if(a){a.focus();a.select()}}}

/* ---------- Flow ---------- */
function newInspection(){S.insp={id:makeId(),created:new Date().toISOString(),part:null,checklist:{},photos:{},extras:[],ai:null,review:null,status:null,tipsShown:false};S.query='';S.busy=false;go('identify')}
function toPhotos(){go('photos');if(S.settings.tips&&!S.insp.tipsShown){S.insp.tipsShown=true;openSheet({type:'tips'})}}
function toRecord(x){const p=partOf(x);return{id:x.id,created:x.created,partId:p.id,entered:p.entered||x.entered||null,checklist:x.checklist||{},photoList:photoList(x).map(i=>({view:i.view,thumb:i.thumb,q:i.q,keep:!!i.keep,sample:!!i.sample})),ai:x.ai||null,status:x.status,review:x.review||null,example:!!x.example}}
function finalize(from){const rec=toRecord(S.insp);const i=S.history.findIndex(h=>h.id===rec.id);if(i>=0)S.history[i]=rec;else S.history.unshift(rec);saveHistory();S.rec=rec;S.recFrom=from;S.insp=null;go('summary');toast(t('sm_saved'))}
function assignPhoto(im){const x=S.insp;if(im.view==='extra')x.extras.push(im);else x.photos[im.view]=im;render();toast(t('ph_added',{v:t('v_'+im.view)}))}
async function handleFile(file){const view=S.capView;if(!file||!S.insp)return;closeSheet();toast(t('q_checking'));
 try{const im=await ingest(file,view,false);if(im.q!=='ok'&&S.settings.quality)openSheet({type:'quality',img:im});else assignPhoto(im)}
 catch(e){toast(t('q_err'))}}
async function useSamples(){const x=S.insp,p=partOf(x);if(p.unlisted||!REF_EL[p.v])return;
 for(const v of ['front','light','tilt','serial']){const cv=noteCanvas(p.v,v,{photo:true,w:960,dark:v==='tilt',seed:hashStr(p.id+v)});const im=await ingest(cv.toDataURL('image/jpeg',.86),v,true);im.keep=im.q!=='ok';x.photos[v]=im}
 render();toast(t('ph_count',{a:VIEWS.filter(v=>x.photos[v]).length,n:VIEWS.length}))}
async function startAnalysis(){if(S.busy)return;const x=S.insp;
 if(S.settings.wifi&&navigator.connection&&navigator.connection.type==='cellular'){S.err='wifi';go('error');return}
 S.busy=true;const token=S.runToken=Math.random();S.an={step:0,slow:false,n:photoList(x).length};go('analysing');
 const slow=S.settings.demo==='slow',total=slow?9000:S.settings.demo==='error'?1800:2600;
 [400,1000,1700].forEach((m,i)=>setTimeout(()=>{if(S.runToken!==token)return;S.an.step=i+1;if(S.screen==='analysing')render()},slow?m*2.4:m));
 if(slow)setTimeout(()=>{if(S.runToken!==token)return;S.an.slow=true;if(S.screen==='analysing')render()},5000);
 const t0=performance.now();let res,err;try{res=await classify(x)}catch(e){err=e}
 await sleep(Math.max(0,total-(performance.now()-t0)));if(S.runToken!==token)return;S.busy=false;
 if(err){S.err='service';go('error');return}
 if(res.error){S.err='unreliable';go('error');return}
 res.ms=total;x.ai=res;x.status=res.label==='inconclusive'?'inconclusive':'preliminary';go('result')}

/* ---------- Export + copy (UI-57) ---------- */
function summaryText(r){const p=partOf(r);const L=[`Counterfeit Hunter · ${t('sm_t')}`,`${t('sm_id')}: ${r.id}`,`${t('sm_date')}: ${fmtDate(r.created)}`,`${t('rv_part')}: ${partName(p)}`,`${t('sm_status')}: ${t('st_'+r.status)}`];
 if(r.ai)L.push(`${t('sm_ai_src')}: ${t('res_'+r.ai.label)}, ${t('res_conf')} ${pct(Math.round(r.ai.conf*100))} (${t('res_thr',{t:r.ai.threshold})}, ${r.ai.model})`);
 const c=Object.entries(r.checklist||{});if(c.length)L.push(`${t('sm_you')} · ${t('rv_check')}: `+c.map(([k,v])=>`${t(k)}: ${t('ck_'+v)}`).join('; '));
 if(r.review){if(r.review.serial)L.push(`${t('rv_serial')}: ${r.review.serial}`);if(r.review.source)L.push(`${t('rv_source')}: ${r.review.source}`);if(r.review.count)L.push(`${t('rv_count')}: ${r.review.count}`);if(r.review.obs)L.push(`${t('sm_obs')}: ${r.review.obs}`)}
 L.push(`${t('rv_photos')}: ${(r.photoList||[]).length}`);if(r.ai)L.push(t('res_disclaimer'));return L.join('\n')}
function reportHtml(r){const p=partOf(r);const row=(k,v)=>`<tr><th>${esc(k)}</th><td>${v}</td></tr>`;
 return `<!doctype html><html lang="${S.settings.lang}"><head><meta charset="utf-8"><title>${esc(r.id)}</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:32px auto;padding:0 16px;color:#12202D}h1{font-size:22px}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{text-align:left;padding:8px;border-top:1px solid #D3DBE4;vertical-align:top}th{width:38%;color:#56636F;font-weight:600}.ph{display:flex;gap:8px;flex-wrap:wrap}.ph figure{margin:0;font-size:12px;color:#56636F}.ph img{width:180px;height:135px;object-fit:cover;border-radius:8px;display:block}.note{background:#E0EAF4;padding:10px 12px;border-radius:8px;font-size:14px}code{font-family:ui-monospace,monospace}</style></head><body>
 <h1>Counterfeit Hunter · ${esc(t('sm_t'))}</h1><table>${row(t('sm_id'),`<code>${esc(r.id)}</code>`)}${row(t('sm_date'),esc(fmtDate(r.created)))}${row(t('rv_part'),esc(partName(p)))}${row(t('sm_status'),esc(t('st_'+r.status)))}
 ${r.ai?row(t('sm_ai_src'),esc(t('res_'+r.ai.label))+' · '+esc(t('res_conf'))+' '+pct(Math.round(r.ai.conf*100))+' · '+esc(t('res_thr',{t:r.ai.threshold}))+' · <code>'+esc(r.ai.model)+'</code>'):''}
 ${Object.entries(r.checklist||{}).map(([k,v])=>row(t('sm_you')+' · '+t(k),esc(t('ck_'+v)))).join('')}
 ${r.review?row(t('sm_obs'),esc(r.review.obs||t('sm_none')))+(r.review.serial?row(t('rv_serial'),'<code>'+esc(r.review.serial)+'</code>'):'')+(r.review.source?row(t('rv_source'),esc(r.review.source)):'')+(r.review.count?row(t('rv_count'),esc(r.review.count)):''):''}</table>
 <div class="ph">${(r.photoList||[]).map(i=>`<figure><img src="${i.thumb}" alt=""><figcaption>${esc(t('v_'+i.view))}</figcaption></figure>`).join('')}</div>
 ${r.ai?`<p class="note">${esc(t('res_disclaimer'))} ${esc(t('res_sim'))}</p>`:''}</body></html>`}

/* ---------- Actions ---------- */
const ACT={
 start:()=>newInspection(),
 tab:d=>{S.insp=null;S.screen=d.to;S.sheet=null;renderSheet();render(true)},
 'back-history':()=>{S.screen='history';render(true)},
 leave:()=>openSheet({type:'confirm',title:t('cf_leave'),desc:t('cf_leave_d'),ok:t('cf_discard'),act:'discard',danger:true}),
 discard:()=>{S.runToken=null;S.busy=false;S.insp=null;go('home')},
 pick:d=>{S.insp.part=getPart(d.id);S.insp.checklist={};go('part')},
 noref:()=>{S.insp.part=resolvePart('UNLISTED',S.query.trim());S.insp.checklist={};toPhotos()},
 'to-identify':()=>go('identify'),'to-part':()=>go('part'),'to-check':()=>go('checklist'),'to-photos':()=>toPhotos(),
 'to-result':()=>go('result'),'to-summary':()=>{S.insp=null;go('summary')},
 ck:d=>{S.insp.checklist[d.k]=d.v;render()},
 'finish-manual':()=>{S.insp.status='manual';finalize('flow')},
 cap:d=>openSheet({type:'capture',view:d.view}),
 take:()=>{S.capView=S.sheet.view;const i=$('#fileCam');i.value='';i.click()},
 gallery:()=>{S.capView=S.sheet.view;const i=$('#fileGal');i.value='';i.click()},
 'q-keep':()=>{const im=S.sheet.img;im.keep=true;closeSheet();assignPhoto(im)},
 'q-retake':()=>openSheet({type:'capture',view:S.sheet.img.view}),
 rm:d=>{if(d.idx!=null)S.insp.extras.splice(+d.idx,1);else delete S.insp.photos[d.view];render();toast(t('ph_removed'))},
 sample:()=>{useSamples()},
 submit:()=>{if(S.busy||!photoList(S.insp).length)return;if(!store.get('ugx.consent',false))openSheet({type:'consent'});else startAnalysis()},
 agree:()=>{store.set('ugx.consent',true);S.sheet=null;renderSheet();startAnalysis()},
 'privacy-from-consent':()=>openSheet({type:'privacy',ret:{type:'consent'}}),
 'cancel-an':()=>{S.runToken=null;S.busy=false;go('photos');toast(t('an_cancelled'))},
 retry:()=>startAnalysis(),
 finish:()=>finalize('flow'),
 'to-review':()=>{S.rvDraft={obs:'',serial:'',source:'',count:''};go('review')},
 'send-review':()=>{const x=S.insp;x.review={...S.rvDraft,sent:new Date().toISOString()};x.status='review';finalize(x.fromRecord?S.recFrom:'flow')},
 escalate:()=>{S.insp={...JSON.parse(JSON.stringify(S.rec)),fromRecord:true};S.rvDraft={obs:'',serial:'',source:'',count:''};go('review')},
 'close-rec':()=>{S.rec=null;go('home')},
 'open-rec':d=>{S.rec=S.history.find(h=>h.id===d.id);if(!S.rec)return;S.recFrom='history';go('summary')},
 export:async()=>{if(!S.dl)return;try{await S.dl.save({filename:`${S.rec.id}.html`,data:reportHtml(S.rec)});toast(t('sm_exported'))}catch(e){if(e&&e.code==='declined')return;toast(t('sm_export_fail'))}},
 copy:()=>{const txt=summaryText(S.rec);try{navigator.clipboard.writeText(txt).then(()=>toast(t('sm_copied')),()=>openSheet({type:'copytext',text:txt}))}catch(e){openSheet({type:'copytext',text:txt})}},
 report:()=>{S.fbDraft={type:'wrong',text:''};S.fbErr=false;openSheet({type:'feedback'})},
 feedback:()=>{S.fbDraft={type:'bug',text:''};S.fbErr=false;openSheet({type:'feedback'})},
 'fb-type':d=>{S.fbDraft.type=d.v;renderSheet()},
 'fb-send':()=>{if(!S.fbDraft.text.trim()){S.fbErr=true;renderSheet();return}const list=store.get('ugx.feedback',[]);list.push({...S.fbDraft,at:new Date().toISOString(),check:S.insp?S.insp.id:(S.rec?S.rec.id:null)});store.set('ugx.feedback',list);S.fbErr=false;S.sheet=null;renderSheet();toast(t('fb_sent'))},
 tips:()=>openSheet({type:'tips'}),privacy:()=>openSheet({type:'privacy'}),lic:()=>openSheet({type:'lic'}),
 tour:()=>openSheet({type:'tour',i:0}),'tour-next':()=>{S.sheet.i++;renderSheet()},
 'tour-done':()=>{S.tourHidden=true;store.set('ugx.tourHidden',true);S.sheet=null;renderSheet();render()},
 'tour-hide':()=>{S.tourHidden=true;store.set('ugx.tourHidden',true);render()},
 tog:d=>{S.settings[d.k]=!S.settings[d.k];saveSettings();applySettings();render()},
 'pin-ok':()=>{const v=($('#pin')||{}).value||'';if(v==='1234'){S.admin=true;S.pinErr=false}else S.pinErr=true;render()},
 'admin-lock':()=>{S.admin=false;render()},
 'del-history':()=>openSheet({type:'confirm',title:t('s_del'),desc:t('s_del_d',{n:S.history.length}),ok:t('s_del_ok'),act:'del-ok',danger:true}),
 'del-ok':()=>{S.history=[];saveHistory();store.set('ugx.seeded',true);S.sheet=null;renderSheet();render();toast(t('s_deleted'))},
 reset:()=>openSheet({type:'confirm',title:t('s_reset'),desc:t('s_reset_d'),ok:t('s_reset_ok'),act:'reset-ok',danger:true}),
 'reset-ok':()=>{S.settings={...DEFAULTS,lang:detectLang()};saveSettings();applySettings();S.sheet=null;renderSheet();render();toast(t('s_reset_done'))},
 'sheet-close':()=>closeSheet(),
};
const dev=$('#device');
dev.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;if(a==='sheet-bg'){if(e.target===b)closeSheet();return}const f=ACT[a];if(f){e.preventDefault();f(b.dataset,b,e)}});
dev.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){S.query=el.value;const r=$('#results');if(r)r.innerHTML=results()}
 else if(el.dataset&&el.dataset.rv){S.rvDraft[el.dataset.rv]=el.value}
 else if(el.id==='fb_text'){S.fbDraft.text=el.value}
 else if(el.id==='thr'){S.settings.threshold=+el.value;const v=$('#thrVal');if(v)v.textContent=pct(+el.value)}});
dev.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&el.dataset.set){S.settings[el.dataset.set]=el.value;saveSettings();applySettings();render()}
 else if(el.id==='thr'){saveSettings()}
 else if(el.id==='fileCam'||el.id==='fileGal'){const f=el.files&&el.files[0];if(f)handleFile(f)}});
dev.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){closeSheet()}else if(e.key==='Enter'&&e.target.id==='pin'){ACT['pin-ok']()}});

/* ---------- Boot ---------- */
applySettings();render(true);
loadRefs().then(()=>{seedExamples();render()});
(async()=>{try{if(window.claude&&typeof window.claude.use==='function'){const d=await window.claude.use('downloads');if(d){S.dl=d;if(S.screen==='summary')render()}}}catch(e){}})();

</script>
